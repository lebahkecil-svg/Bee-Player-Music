name: Build Bee Player Music APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak sumber dari BeePlayerMusic-source.zip
        run: |
          mkdir -p project
          unzip -q BeePlayerMusic-source.zip -d project
          ls -la project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: project

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BeePlayerMusic-APK
          path: project/app/build/outputs/apk/**/*.apk
